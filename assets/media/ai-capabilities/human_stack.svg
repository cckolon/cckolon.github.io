<svg xmlns="http://www.w3.org/2000/svg" width="500" height="364" viewBox="0 80 700 510" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect y="80" width="700" height="510" fill="#ffffff"/>

  <!-- Headings -->
  <g fill="#000000" text-anchor="middle" font-size="28" font-weight="bold">
    <text x="490" y="128">The human mind</text>
  </g>

  <!-- Human stack -->
  <g fill="#ffffff" stroke="#000000" stroke-width="2">
    <rect x="380" y="150" width="220" height="80"/>
    <rect x="380" y="230" width="220" height="80"/>
    <rect x="380" y="310" width="220" height="80"/>
    <rect x="380" y="390" width="220" height="80"/>
    <rect x="380" y="470" width="220" height="80"/>
  </g>
  <g fill="#000000" text-anchor="middle">
    <text x="490" y="196" font-size="18" font-weight="bold">Conscious thought</text>
    <text x="490" y="280" font-size="26" font-weight="bold">?</text>
    <text x="490" y="360" font-size="26" font-weight="bold">?</text>
    <text x="490" y="440" font-size="26" font-weight="bold">?</text>
    <text x="490" y="516" font-size="18" font-weight="bold">Neurons</text>
  </g>

  <!-- Examples (ascending, bottom to top) with lines to the stack -->
  <g stroke="#000000" stroke-width="1.2">
    <line x1="310" y1="535.0" x2="380" y2="535.0"/>
    <line x1="310" y1="498.0" x2="380" y2="498.0"/>
    <line x1="310" y1="461.0" x2="380" y2="461.0"/>
    <line x1="310" y1="424.0" x2="380" y2="424.0"/>
    <line x1="310" y1="387.0" x2="380" y2="387.0"/>
    <line x1="310" y1="350.0" x2="380" y2="350.0"/>
    <line x1="310" y1="313.0" x2="380" y2="313.0"/>
    <line x1="310" y1="276.0" x2="380" y2="276.0"/>
    <line x1="310" y1="239.0" x2="380" y2="239.0"/>
    <line x1="310" y1="202.0" x2="380" y2="202.0"/>
    <line x1="310" y1="165.0" x2="380" y2="165.0"/>
  </g>
  <g fill="#000000" text-anchor="end" font-size="15">
    <text x="300" y="540.0">Involuntary reflexes</text>
    <text x="300" y="503.0">Heartbeat</text>
    <text x="300" y="466.0">Breathing patterns</text>
    <text x="300" y="429.0">Grasping things</text>
    <text x="300" y="392.0">Walking</text>
    <text x="300" y="355.0">Finding your way around</text>
    <text x="300" y="318.0">Appreciating music</text>
    <text x="300" y="281.0">Empathizing with people</text>
    <text x="300" y="244.0">Deciding if you like something</text>
    <text x="300" y="207.0">Coming up with a joke</text>
    <text x="300" y="170.0">Solving a quadratic equation</text>
  </g>

  <!-- Black upward arrow -->
  <line x1="660" y1="545" x2="660" y2="160" stroke="#000000" stroke-width="3" marker-end="url(#arrow-black)"/>

  <text x="649" y="350" font-size="16" fill="#000000" text-anchor="middle" transform="rotate(-90 649 350)">more abstract</text>

</svg>
