<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 1000 380" font-family="Georgia, 'Times New Roman', serif">
  <rect y="60" width="1000" height="380" fill="#ffffff"/>

  <g fill="#ffffff" stroke="#000000" stroke-width="2">
    <!-- Column 1 -->
    <rect x="40" y="120" width="280" height="56"/>
    <rect x="40" y="176" width="280" height="56"/>
    <rect x="40" y="232" width="280" height="56"/>
    <rect x="40" y="288" width="280" height="56"/>
    <rect x="40" y="344" width="280" height="56"/>
    <!-- Column 2 -->
    <rect x="360" y="120" width="280" height="56"/>
    <rect x="360" y="176" width="280" height="56"/>
    <rect x="360" y="232" width="280" height="56"/>
    <rect x="360" y="288" width="280" height="56"/>
    <rect x="360" y="344" width="280" height="56"/>
    <!-- Column 3 -->
    <rect x="680" y="120" width="280" height="56"/>
    <rect x="680" y="176" width="280" height="56"/>
    <rect x="680" y="232" width="280" height="56"/>
    <rect x="680" y="288" width="280" height="56"/>
    <rect x="680" y="344" width="280" height="56"/>
  </g>

  <g fill="#000000" text-anchor="middle">
    <!-- Headings -->
    <text x="180" y="96" font-size="28" font-weight="bold">Aunt Hillary</text>
    <text x="500" y="96" font-size="28" font-weight="bold">The human mind</text>
    <text x="820" y="96" font-size="28" font-weight="bold">Neural networks</text>

    <!-- Column 1 labels -->
    <text x="180" y="154" font-size="18" font-weight="bold">Conscious thought</text>
    <text x="180" y="210" font-size="18" font-style="italic">signals</text>
    <text x="180" y="266" font-size="18" font-style="italic">signals</text>
    <text x="180" y="322" font-size="18" font-style="italic">signals</text>
    <text x="180" y="378" font-size="18" font-weight="bold">Ants</text>

    <!-- Column 2 labels -->
    <text x="500" y="154" font-size="18" font-weight="bold">Conscious thought</text>
    <text x="500" y="214" font-size="26" font-weight="bold">?</text>
    <text x="500" y="270" font-size="26" font-weight="bold">?</text>
    <text x="500" y="326" font-size="26" font-weight="bold">?</text>
    <text x="500" y="378" font-size="18" font-weight="bold">Neurons</text>

    <!-- Column 3 labels -->
    <text x="820" y="154" font-size="18" font-weight="bold">AI capabilities</text>
    <text x="820" y="214" font-size="26" font-weight="bold">?</text>
    <text x="820" y="270" font-size="26" font-weight="bold">?</text>
    <text x="820" y="322" font-size="18" font-style="italic">circuits maybe?</text>
    <text x="820" y="367" font-size="15" font-weight="bold">Matrix multiplications,</text>
    <text x="820" y="387" font-size="15" font-weight="bold">biases, activation functions</text>
